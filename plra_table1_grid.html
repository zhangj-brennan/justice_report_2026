<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLRA Adoption Grid</title>
<!--
  Static small multiples: one equal-area tile cartogram per row of
  plra_table1.csv, titled with that row's "Provisions Adopted" label.
  Same grid layout and colors as plra_table1.html.
-->
<link rel="stylesheet" href="style.css">
<style>
  .panel { max-width: 1000px; }
  .group { margin-top: 24px; }
  .group h2 {
    margin: 0 0 12px;
    font-family: "BentonStrong";
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px 20px;
  }
  .card h3 {
    font-size: 13px;
    line-height: 1.3;
    margin: 0 0 2px;
    min-height: 34px;
  }
  .card .count {
    font-family: "Benton";
    font-size: 12px;
    margin: 0 0 6px;
  }
  .card svg text {
    font-family: "Benton";
    font-size: 13px;
    text-anchor: middle;
    dominant-baseline: central;
  }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="container">
  <div id="title">
    <h1 id="pageTitle">Summary of PLRA State Analog Adoption (2026)</h1>
  </div>
  <div class="panel" id="panel">
    <div id="status" class="status">Loading…</div>
  </div>
  <p class="footnote" id="sourceLine"><strong>Source:</strong> Brennan Center analysis. For more information, see the Appendix.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(async function () {
  const CONFIG = {
    dataCsvPath: "plra_table1.csv",
    dataColumns: { label: "Provisions Adopted", states: "States", group: "Group" },
    colors: { yes: "#711471", na: "#cfcdc7" }
  };

  const NAME_TO_ABBR = {
    "Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO",
    "Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID",
    "Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA",
    "Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN",
    "Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV",
    "New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC",
    "North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA",
    "Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX",
    "Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV",
    "Wisconsin":"WI","Wyoming":"WY"
  };

  // Same tile positions as plra.html, minus DC (not in Table 1).
  const GRID = {
    AK:[0,0], ME:[10,0],
    NH:[10,1], VT:[9,1],
    WA:[0,2], ID:[1,2], MT:[2,2], ND:[3,2], MN:[4,2], WI:[5,2], MI:[6,2], NY:[7,2], MA:[9,2], RI:[10,2],
    OR:[0,3], NV:[1,3], WY:[2,3], SD:[3,3], IA:[4,3], IL:[5,3], IN:[6,3], OH:[7,3], PA:[8,3], NJ:[9,3], CT:[10,3],
    CA:[0,4], UT:[1,4], CO:[2,4], NE:[3,4], MO:[4,4], KY:[5,4], WV:[6,4], VA:[7,4], MD:[8,4], DE:[9,4],
    AZ:[1,5], NM:[2,5], KS:[3,5], AR:[4,5], TN:[5,5], NC:[6,5], SC:[7,5],
    OK:[3,6], LA:[4,6], MS:[5,6], AL:[6,6], GA:[7,6],
    HI:[0,7], TX:[3,7], FL:[8,7]
  };
  const COLS = 11, ROWS = 8, CELL = 40, GAP = 2;

  const panel = document.getElementById("panel");
  let rows;
  try {
    rows = await d3.csv(CONFIG.dataCsvPath, row => ({
      label: (row[CONFIG.dataColumns.label] || "").trim(),
      group: (row[CONFIG.dataColumns.group] || "").trim(),
      stateNames: (row[CONFIG.dataColumns.states] || "").split(",").map(s => s.trim()).filter(Boolean)
    }));
  } catch (err) {
    document.getElementById("status").textContent = "Could not load " + CONFIG.dataCsvPath + " — make sure it sits next to this page.";
    return;
  }
  document.getElementById("status").remove();

  const tiles = Object.entries(GRID);

  d3.groups(rows, r => r.group).forEach(([group, items]) => {
    const section = d3.select(panel).append("section").attr("class", "group");
    section.append("h2").text(group);
    const grid = section.append("div").attr("class", "grid");

    items.forEach(item => {
      const on = new Set(item.stateNames.map(n => NAME_TO_ABBR[n]).filter(Boolean));
      const unknown = item.stateNames.filter(n => !NAME_TO_ABBR[n]);
      if (unknown.length) console.warn(`"${item.label}": unrecognized state names`, unknown);

      const card = grid.append("div").attr("class", "card");
      card.append("h3").text(item.label);
      card.append("p").attr("class", "count")
        .text(`${item.stateNames.length} ${item.stateNames.length === 1 ? "state" : "states"}`);

      const svg = card.append("svg")
        .attr("viewBox", `0 0 ${COLS * CELL} ${ROWS * CELL}`)
        .attr("role", "img")
        .attr("aria-label", `${item.label}: ${item.stateNames.join(", ") || "no states"}`);

      const g = svg.selectAll("g").data(tiles).join("g")
        .attr("transform", ([, [c, r]]) => `translate(${c * CELL + GAP / 2},${r * CELL + GAP / 2})`);
      g.append("rect")
        .attr("width", CELL - GAP).attr("height", CELL - GAP)
        .attr("fill", ([abbr]) => on.has(abbr) ? CONFIG.colors.yes : CONFIG.colors.na);
      g.append("text")
        .attr("x", (CELL - GAP) / 2).attr("y", (CELL - GAP) / 2)
        .attr("fill", ([abbr]) => on.has(abbr) ? "white" : "black")
        .text(([abbr]) => abbr);
    });
  });
})();
</script>
</body>
</html>
